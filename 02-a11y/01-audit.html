<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 01 - Audit</title>
    <h1>Exercise 01 - Audit</h1>
  </head>
  <body>
    <form>
      <label for="name">Name:</label><br />
      <input type="text" id="name" name="name" /><br /><br />
      <label for="address">Address:</label><br />
      <input type="text" id="address" name="address" />
      <br /><br />
      <label for="city">City:</label><br />
      <input type="text" id="city" name="city" />
      <br /><br />
      <label for="zip">Zip Code:</label><br />
      <input type="text" id="zip" name="zip" />
      <br /><br />

      <fieldset>
        <legend>Credit Card Type</legend>
        <label>
          <input type="radio" name="card" value="visa" /> Visa<br />
        </label>
        <label>
          <input type="radio" name="card" value="mastercard" /> MasterCard<br />
        </label>
        <label>
          <input type="radio" name="card" value="amex" /> American Express<br /><br />
        </label>
      </fieldset>

      <label for="cc_number">Credit Card Number:</label><br />
      <input type="text" id="cc_number" name="cc_number" /><br /><br />
      <label for="cvv">CVC:</label><br />
      <input type="text" id="cvv" name="cvv" /><br /><br />
      <input type="button" value="Submit" />
    </form>
  </body>
